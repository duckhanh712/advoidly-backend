# Local development infrastructure for Urban Alert Platform.
# Application services run on the host (`yarn dev`); see README.md.
# All values have development defaults and can be overridden in `.env`.
name: urban-alert

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    # The official postgis/postgis images are amd64-only. Apple Silicon runs them through
    # Rosetta (OrbStack / Docker Desktop). Override both variables to use a native arm64 image.
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urban_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urban_admin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-urban_alert}
      # Password for the per-service roles created by the init script (dev only).
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_dev_password}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mounted as a single file so the image's own PostGIS init script is preserved.
      - ./infrastructure/postgres/init/20-roles-and-schemas.sh:/docker-entrypoint-initdb.d/20-roles-and-schemas.sh:ro
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'redis-cli', 'ping']

  # Single-node Apache Kafka (official image) in KRaft mode (no ZooKeeper).
  # Kafka 3.9 rather than 4.x: 4.0 removed old protocol versions and kafkajs is not verified against it.
  #   INTERNAL listener (kafka:29092) — other containers (kafka-ui, kafka-init)
  #   EXTERNAL listener (localhost:${KAFKA_PORT}) — services running on the host
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.1}
    restart: unless-stopped
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init; typos should fail loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    # The check starts a JVM CLI, which alone can take 5-15 s (longer under emulation),
    # so it needs a far larger timeout and warm-up than the other services.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1',
        ]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s

  # One-shot job: creates application topics and dead-letter topics, then exits.
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.1}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '/scripts/create-topics.sh']
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      TOPICS_FILE: /scripts/topics.txt
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/scripts/create-topics.sh:ro
      - ./infrastructure/kafka/topics.txt:/scripts/topics.txt:ro
    restart: 'no'

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:v1.2.0}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: urban-alert-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'

volumes:
  postgres-data:
  redis-data:
  kafka-data:
